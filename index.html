<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Cycling Road — Motion Prototype 01.5</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dfe9ee;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #label {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(30, 40, 45, 0.45);

      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three":
          "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>

<body>

  <div id="label">MOTION PROTOTYPE 01.5</div>

  <script type="module">

    import * as THREE from "three";


    // ============================================================
    // SCENE
    // ============================================================

    const scene = new THREE.Scene();

    scene.background =
      new THREE.Color(0xdfe9ee);

    scene.fog =
      new THREE.Fog(
        0xdfe9ee,
        35,
        150
      );


    const camera =
      new THREE.PerspectiveCamera(
        52,
        window.innerWidth / window.innerHeight,
        0.1,
        250
      );


    const renderer =
      new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
      });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    document.body.appendChild(
      renderer.domElement
    );



    // ============================================================
    // LIGHT
    // ============================================================

    scene.add(
      new THREE.HemisphereLight(
        0xffffff,
        0xaeb7a4,
        2.1
      )
    );


    const sun =
      new THREE.DirectionalLight(
        0xffffff,
        1.5
      );


    sun.position.set(
      -10,
      20,
      8
    );


    scene.add(sun);



    // ============================================================
    // HORIZONTAL ROUTE
    //
    // IMPORTANT:
    //
    // All control points have Y = 0.
    //
    // Catmull-Rom is now responsible ONLY for the shape of the road
    // when seen from above.
    //
    // It cannot create hills or vertical oscillation.
    // ============================================================

    const horizontalPoints = [

      new THREE.Vector3(
         0, 0,   0
      ),

      new THREE.Vector3(
        -2, 0, -12
      ),

      new THREE.Vector3(
        -7, 0, -25
      ),

      new THREE.Vector3(
        -5, 0, -39
      ),

      new THREE.Vector3(
         2, 0, -53
      ),

      new THREE.Vector3(
         8, 0, -67
      ),

      new THREE.Vector3(
         6, 0, -82
      ),

      new THREE.Vector3(
         0, 0, -98
      )

    ];


    const horizontalRoute =
      new THREE.CatmullRomCurve3(
        horizontalPoints,
        false,
        "catmullrom",
        0.35
      );



    // ============================================================
    // ALTITUDE PROFILE
    //
    // Vertical movement is completely independent from the spline.
    //
    // For this diagnostic version:
    //
    // start = 18
    // end   = 0
    //
    // It is deliberately almost a single continuous downhill slope.
    //
    // smoothstep is used only at the very beginning and end so that
    // entering/leaving the slope is not abrupt.
    // ============================================================

    const START_HEIGHT =
      18;


    const END_HEIGHT =
      0;


    function smootherstep(t) {

      t =
        THREE.MathUtils.clamp(
          t,
          0,
          1
        );


      return (
        t * t * t *
        (
          t *
          (
            t * 6 - 15
          )
          + 10
        )
      );

    }


    function getAltitude(t) {

      // Only the first and last 8% are gently blended.
      // The central 84% is effectively a straight descent.

      const blend =
        0.08;


      let descent;


      if (t < blend) {

        const local =
          t / blend;


        const eased =
          smootherstep(local);


        descent =
          blend *
          eased;

      }

      else if (t > 1 - blend) {

        const local =
          (
            t -
            (1 - blend)
          ) /
          blend;


        const eased =
          smootherstep(local);


        descent =
          (1 - blend) +
          blend *
          eased;

      }

      else {

        descent =
          t;

      }


      return THREE.MathUtils.lerp(
        START_HEIGHT,
        END_HEIGHT,
        descent
      );

    }



    // ============================================================
    // ROUTE HELPERS
    // ============================================================

    function getRoutePoint(t) {

      const point =
        horizontalRoute.getPointAt(t);


      point.y =
        getAltitude(t);


      return point;

    }


    function getFlatTangent(t) {

      const tangent =
        horizontalRoute
          .getTangentAt(t)
          .normalize();


      tangent.y =
        0;


      return tangent.normalize();

    }



    // ============================================================
    // ROAD
    // ============================================================

    const roadWidth =
      5.5;


    const roadSegments =
      180;


    const positions = [];
    const indices = [];


    for (
      let i = 0;
      i <= roadSegments;
      i++
    ) {

      const t =
        i / roadSegments;


      const point =
        getRoutePoint(t);


      const flatTangent =
        getFlatTangent(t);


      const side =
        new THREE.Vector3(
          -flatTangent.z,
          0,
          flatTangent.x
        );


      const left =
        point
          .clone()
          .addScaledVector(
            side,
            roadWidth / 2
          );


      const right =
        point
          .clone()
          .addScaledVector(
            side,
            -roadWidth / 2
          );


      left.y += 0.02;
      right.y += 0.02;


      positions.push(
        left.x,
        left.y,
        left.z,

        right.x,
        right.y,
        right.z
      );


      if (
        i < roadSegments
      ) {

        const a = i * 2;
        const b = a + 1;
        const c = a + 2;
        const d = a + 3;


        indices.push(
          a, c, b,
          c, d, b
        );

      }

    }


    const roadGeometry =
      new THREE.BufferGeometry();


    roadGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        positions,
        3
      )
    );


    roadGeometry.setIndex(
      indices
    );


    roadGeometry.computeVertexNormals();


    const road =
      new THREE.Mesh(
        roadGeometry,
        new THREE.MeshStandardMaterial({
          color: 0x697176,
          roughness: 1
        })
      );


    scene.add(road);



    // ============================================================
    // ROAD EDGE MARKERS
    // ============================================================

    const markerGeometry =
      new THREE.BoxGeometry(
        0.12,
        0.05,
        1.2
      );


    const markerMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xe6e4d8
      });


    for (
      let i = 0;
      i <= 34;
      i++
    ) {

      const t =
        i / 34;


      const point =
        getRoutePoint(t);


      const flatTangent =
        getFlatTangent(t);


      const side =
        new THREE.Vector3(
          -flatTangent.z,
          0,
          flatTangent.x
        );


      for (
        const direction of [-1, 1]
      ) {

        const marker =
          new THREE.Mesh(
            markerGeometry,
            markerMaterial
          );


        marker.position
          .copy(point)
          .addScaledVector(
            side,
            direction *
            (
              roadWidth / 2 -
              0.25
            )
          );


        marker.position.y +=
          0.08;


        marker.rotation.y =
          Math.atan2(
            flatTangent.x,
            flatTangent.z
          );


        scene.add(marker);

      }

    }



    // ============================================================
    // GROUND
    //
    // Still only a temporary diagnostic background.
    // Proper terrain comes later.
    // ============================================================

    const ground =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          260,
          260
        ),
        new THREE.MeshStandardMaterial({
          color: 0xaab69b,
          roughness: 1
        })
      );


    ground.rotation.x =
      -Math.PI / 2;


    ground.position.set(
      0,
      -1.5,
      -50
    );


    scene.add(ground);



    // ============================================================
    // TEMPORARY BICYCLE
    // ============================================================

    const bicycle =
      new THREE.Group();


    const body =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.65,
          0.45,
          1.55
        ),
        new THREE.MeshStandardMaterial({
          color: 0xc85f4c,
          roughness: 0.8
        })
      );


    body.position.y =
      0.45;


    bicycle.add(body);


    const nose =
      new THREE.Mesh(
        new THREE.ConeGeometry(
          0.36,
          0.8,
          4
        ),
        new THREE.MeshStandardMaterial({
          color: 0xf0d3a2
        })
      );


    nose.rotation.x =
      Math.PI / 2;


    nose.position.set(
      0,
      0.5,
      -1.05
    );


    bicycle.add(nose);


    const rear =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.9,
          0.12,
          0.15
        ),
        new THREE.MeshStandardMaterial({
          color: 0x3d4549
        })
      );


    rear.position.set(
      0,
      0.7,
      0.65
    );


    bicycle.add(rear);


    scene.add(bicycle);



    // ============================================================
    // MOTION
    // ============================================================

    const LOOP_DURATION =
      30;


    let elapsed =
      0;


    let previousTime =
      performance.now();


    const futureFlat =
      new THREE.Vector3();



    // ============================================================
    // CAMERA
    //
    // Identical philosophy to 1.4.
    //
    // No spring.
    // No camera shake.
    // No sine.
    // No vertical smoothing.
    // No curve offset.
    // ============================================================

    const CAMERA_DISTANCE =
      6.7;


    const CAMERA_HEIGHT =
      3.5;


    const LOOK_DISTANCE =
      5.0;


    const LOOK_HEIGHT =
      0.7;


    const lookTarget =
      new THREE.Vector3();



    // ============================================================
    // ANIMATION
    // ============================================================

    function animate(now) {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          (now - previousTime) /
          1000,
          0.05
        );


      previousTime =
        now;


      elapsed +=
        delta;



      // ==========================================================
      // PURE LINEAR PROGRESS
      // ==========================================================

      const progress =
        (
          elapsed %
          LOOP_DURATION
        ) /
        LOOP_DURATION;


      const safeProgress =
        Math.min(
          progress,
          0.9999
        );



      // ==========================================================
      // ROUTE POSITION
      // ==========================================================

      const point =
        getRoutePoint(
          safeProgress
        );


      const flatTangent =
        getFlatTangent(
          safeProgress
        );



      // ==========================================================
      // BICYCLE
      // ==========================================================

      bicycle.position.copy(
        point
      );


      bicycle.position.y +=
        0.12;


      bicycle.rotation.y =
        Math.atan2(
          flatTangent.x,
          flatTangent.z
        );



      // ==========================================================
      // LEAN
      // ==========================================================

      const futureProgress =
        Math.min(
          safeProgress + 0.008,
          0.9999
        );


      futureFlat.copy(
        getFlatTangent(
          futureProgress
        )
      );


      const curveAmount =
        flatTangent.x *
        futureFlat.z -
        flatTangent.z *
        futureFlat.x;


      bicycle.rotation.z =
        THREE.MathUtils.clamp(
          curveAmount * 8,
          -0.18,
          0.18
        );



      // ==========================================================
      // CAMERA POSITION
      //
      // Uses the SAME altitude as the bicycle.
      //
      // Therefore the bicycle's vertical screen relationship
      // remains fixed.
      // ==========================================================

      camera.position
        .copy(point)
        .addScaledVector(
          flatTangent,
          -CAMERA_DISTANCE
        );


      camera.position.y =
        point.y +
        CAMERA_HEIGHT;



      // ==========================================================
      // LOOK TARGET
      //
      // Uses the SAME altitude reference.
      //
      // camera.y - lookTarget.y remains constant.
      // ==========================================================

      lookTarget
        .copy(point)
        .addScaledVector(
          flatTangent,
          LOOK_DISTANCE
        );


      lookTarget.y =
        point.y +
        LOOK_HEIGHT;


      camera.lookAt(
        lookTarget
      );



      // ==========================================================
      // RENDER
      // ==========================================================

      renderer.render(
        scene,
        camera
      );

    }



    requestAnimationFrame(
      animate
    );



    // ============================================================
    // RESIZE
    // ============================================================

    function resize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;


      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );


      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio,
          2
        )
      );

    }


    window.addEventListener(
      "resize",
      resize
    );


  </script>

</body>
</html>
