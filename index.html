<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Cycling Road — Motion Prototype 01.3</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #dfe9ee;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #label {
      position: fixed;
      left: 50%;
      bottom: calc(18px + env(safe-area-inset-bottom));
      transform: translateX(-50%);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(30, 40, 45, 0.45);

      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three":
          "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
      }
    }
  </script>
</head>

<body>

  <div id="label">MOTION PROTOTYPE 01.3</div>

  <script type="module">

    import * as THREE from "three";


    // ============================================================
    // BASIC SETUP
    // ============================================================

    const scene = new THREE.Scene();

    scene.background = new THREE.Color(0xdfe9ee);
    scene.fog = new THREE.Fog(
      0xdfe9ee,
      35,
      150
    );


    const camera = new THREE.PerspectiveCamera(
      52,
      window.innerWidth / window.innerHeight,
      0.1,
      250
    );


    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );


    document.body.appendChild(
      renderer.domElement
    );



    // ============================================================
    // LIGHT
    // ============================================================

    const hemisphereLight =
      new THREE.HemisphereLight(
        0xffffff,
        0xaeb7a4,
        2.1
      );


    scene.add(
      hemisphereLight
    );


    const directionalLight =
      new THREE.DirectionalLight(
        0xffffff,
        1.5
      );


    directionalLight.position.set(
      -10,
      20,
      8
    );


    scene.add(
      directionalLight
    );



    // ============================================================
    // ROUTE
    // ============================================================

    const routePoints = [

      new THREE.Vector3(
         0, 18,   0
      ),

      new THREE.Vector3(
        -2, 16, -12
      ),

      new THREE.Vector3(
        -7, 13, -25
      ),

      new THREE.Vector3(
        -5, 10, -39
      ),

      new THREE.Vector3(
         2,  7, -53
      ),

      new THREE.Vector3(
         8,  4, -67
      ),

      new THREE.Vector3(
         6,  2, -82
      ),

      new THREE.Vector3(
         0,  0, -98
      )

    ];


    const route =
      new THREE.CatmullRomCurve3(
        routePoints,
        false,
        "catmullrom",
        0.35
      );



    // ============================================================
    // ROAD
    // ============================================================

    const roadWidth =
      5.5;


    const roadSegments =
      180;


    const roadPositions =
      [];


    const roadIndices =
      [];


    for (
      let i = 0;
      i <= roadSegments;
      i++
    ) {

      const t =
        i / roadSegments;


      const point =
        route.getPointAt(t);


      const tangent =
        route
          .getTangentAt(t)
          .normalize();


      // Horizontal direction only.
      const flatTangent =
        new THREE.Vector3(
          tangent.x,
          0,
          tangent.z
        ).normalize();


      const side =
        new THREE.Vector3(
          -flatTangent.z,
          0,
          flatTangent.x
        ).normalize();


      const left =
        point
          .clone()
          .addScaledVector(
            side,
            roadWidth * 0.5
          );


      const right =
        point
          .clone()
          .addScaledVector(
            side,
            -roadWidth * 0.5
          );


      left.y += 0.02;
      right.y += 0.02;


      roadPositions.push(
        left.x,
        left.y,
        left.z
      );


      roadPositions.push(
        right.x,
        right.y,
        right.z
      );


      if (
        i < roadSegments
      ) {

        const a =
          i * 2;

        const b =
          a + 1;

        const c =
          a + 2;

        const d =
          a + 3;


        roadIndices.push(
          a,
          c,
          b
        );


        roadIndices.push(
          c,
          d,
          b
        );

      }

    }


    const roadGeometry =
      new THREE.BufferGeometry();


    roadGeometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(
        roadPositions,
        3
      )
    );


    roadGeometry.setIndex(
      roadIndices
    );


    roadGeometry.computeVertexNormals();


    const road =
      new THREE.Mesh(
        roadGeometry,
        new THREE.MeshStandardMaterial({
          color: 0x697176,
          roughness: 1
        })
      );


    scene.add(
      road
    );



    // ============================================================
    // ROAD EDGE MARKERS
    // ============================================================

    const markerGeometry =
      new THREE.BoxGeometry(
        0.12,
        0.05,
        1.2
      );


    const markerMaterial =
      new THREE.MeshStandardMaterial({
        color: 0xe6e4d8
      });


    for (
      let i = 0;
      i <= 34;
      i++
    ) {

      const t =
        i / 34;


      const point =
        route.getPointAt(t);


      const tangent =
        route
          .getTangentAt(t)
          .normalize();


      const flatTangent =
        new THREE.Vector3(
          tangent.x,
          0,
          tangent.z
        ).normalize();


      const side =
        new THREE.Vector3(
          -flatTangent.z,
          0,
          flatTangent.x
        ).normalize();


      for (
        const direction
        of [-1, 1]
      ) {

        const marker =
          new THREE.Mesh(
            markerGeometry,
            markerMaterial
          );


        const position =
          point
            .clone()
            .addScaledVector(
              side,
              direction *
              (
                roadWidth * 0.5 -
                0.25
              )
            );


        position.y +=
          0.08;


        marker.position.copy(
          position
        );


        marker.rotation.y =
          Math.atan2(
            flatTangent.x,
            flatTangent.z
          );


        scene.add(
          marker
        );

      }

    }



    // ============================================================
    // TERRAIN
    // ============================================================

    const ground =
      new THREE.Mesh(
        new THREE.PlaneGeometry(
          260,
          260
        ),
        new THREE.MeshStandardMaterial({
          color: 0xaab69b,
          roughness: 1
        })
      );


    ground.rotation.x =
      -Math.PI / 2;


    ground.position.set(
      0,
      -1.5,
      -50
    );


    scene.add(
      ground
    );



    // ============================================================
    // TEMPORARY BICYCLE
    // ============================================================

    const bicycle =
      new THREE.Group();


    const body =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.65,
          0.45,
          1.55
        ),
        new THREE.MeshStandardMaterial({
          color: 0xc85f4c,
          roughness: 0.8
        })
      );


    body.position.y =
      0.45;


    bicycle.add(
      body
    );


    const nose =
      new THREE.Mesh(
        new THREE.ConeGeometry(
          0.36,
          0.8,
          4
        ),
        new THREE.MeshStandardMaterial({
          color: 0xf0d3a2
        })
      );


    nose.rotation.x =
      Math.PI / 2;


    nose.position.set(
      0,
      0.5,
      -1.05
    );


    bicycle.add(
      nose
    );


    const rear =
      new THREE.Mesh(
        new THREE.BoxGeometry(
          0.9,
          0.12,
          0.15
        ),
        new THREE.MeshStandardMaterial({
          color: 0x3d4549
        })
      );


    rear.position.set(
      0,
      0.7,
      0.65
    );


    bicycle.add(
      rear
    );


    scene.add(
      bicycle
    );



    // ============================================================
    // MOTION
    // ============================================================

    const LOOP_DURATION =
      30;


    let elapsed =
      0;


    let previousTime =
      performance.now();


    const tangent =
      new THREE.Vector3();


    const flatTangent =
      new THREE.Vector3();


    const futureTangent =
      new THREE.Vector3();


    const futureFlatTangent =
      new THREE.Vector3();


    const sideVector =
      new THREE.Vector3();



    // ============================================================
    // CAMERA
    //
    // Horizon Lock design:
    //
    // - Y follows rider height directly.
    // - Camera and look target use the SAME vertical reference.
    // - Road slope is NOT used for camera pitch.
    // - Pitch therefore stays constant.
    // ============================================================

    const CAMERA_DISTANCE =
      6.7;


    const CAMERA_HEIGHT =
      3.5;


    const LOOK_DISTANCE =
      5.0;


    // Difference between camera height
    // and look height.
    //
    // This determines a fixed downward pitch.
    const LOOK_HEIGHT =
      0.7;


    const cameraTarget =
      new THREE.Vector3();


    const lookTarget =
      new THREE.Vector3();


    const smoothedLook =
      new THREE.Vector3();



    // ============================================================
    // INITIAL POSITION
    // ============================================================

    const initialPoint =
      route.getPointAt(0);


    const initialRouteTangent =
      route
        .getTangentAt(0)
        .normalize();


    const initialFlatTangent =
      new THREE.Vector3(
        initialRouteTangent.x,
        0,
        initialRouteTangent.z
      ).normalize();


    bicycle.position.copy(
      initialPoint
    );


    bicycle.position.y +=
      0.12;


    bicycle.rotation.y =
      Math.atan2(
        initialFlatTangent.x,
        initialFlatTangent.z
      );


    camera.position
      .copy(initialPoint)
      .addScaledVector(
        initialFlatTangent,
        -CAMERA_DISTANCE
      );


    camera.position.y =
      initialPoint.y +
      CAMERA_HEIGHT;


    smoothedLook
      .copy(initialPoint)
      .addScaledVector(
        initialFlatTangent,
        LOOK_DISTANCE
      );


    smoothedLook.y =
      initialPoint.y +
      LOOK_HEIGHT;


    camera.lookAt(
      smoothedLook
    );



    // ============================================================
    // ANIMATION
    // ============================================================

    function animate(now) {

      requestAnimationFrame(
        animate
      );


      const delta =
        Math.min(
          (now - previousTime) /
          1000,
          0.05
        );


      previousTime =
        now;


      elapsed +=
        delta;



      // ----------------------------------------------------------
      // ROUTE PROGRESS
      // ----------------------------------------------------------

      const rawProgress =
        (
          elapsed %
          LOOP_DURATION
        ) /
        LOOP_DURATION;


      const wave =
        Math.sin(
          rawProgress *
          Math.PI *
          2
        ) *
        0.004;


      const progress =
        THREE.MathUtils.clamp(
          rawProgress + wave,
          0,
          0.9999
        );



      // ----------------------------------------------------------
      // ROUTE POSITION
      // ----------------------------------------------------------

      const point =
        route.getPointAt(
          progress
        );


      tangent
        .copy(
          route.getTangentAt(
            progress
          )
        )
        .normalize();



      // ==========================================================
      // IMPORTANT:
      //
      // Remove vertical direction from the route tangent.
      //
      // The camera only knows which way the road turns
      // LEFT / RIGHT.
      //
      // It does not know whether the road is pointing
      // UP / DOWN.
      // ==========================================================

      flatTangent.set(
        tangent.x,
        0,
        tangent.z
      ).normalize();



      // ----------------------------------------------------------
      // BICYCLE POSITION
      // ----------------------------------------------------------

      bicycle.position.copy(
        point
      );


      bicycle.position.y +=
        0.12;


      bicycle.rotation.y =
        Math.atan2(
          flatTangent.x,
          flatTangent.z
        );



      // ----------------------------------------------------------
      // BICYCLE LEAN
      // ----------------------------------------------------------

      const futureProgress =
        Math.min(
          progress + 0.008,
          0.9999
        );


      futureTangent
        .copy(
          route.getTangentAt(
            futureProgress
          )
        )
        .normalize();


      futureFlatTangent.set(
        futureTangent.x,
        0,
        futureTangent.z
      ).normalize();


      const cross =
        flatTangent.x *
        futureFlatTangent.z -
        flatTangent.z *
        futureFlatTangent.x;


      const targetLean =
        THREE.MathUtils.clamp(
          cross * 8,
          -0.18,
          0.18
        );


      bicycle.rotation.z =
        THREE.MathUtils.lerp(
          bicycle.rotation.z,
          targetLean,
          1 -
          Math.exp(
            -delta * 5
          )
        );



      // ==========================================================
      // CAMERA TARGET
      //
      // X/Z:
      // Smoothly follows the rider.
      //
      // Y:
      // Uses rider altitude + constant camera height.
      //
      // No delayed vertical tracking.
      // ==========================================================

      cameraTarget
        .copy(point)
        .addScaledVector(
          flatTangent,
          -CAMERA_DISTANCE
        );


      sideVector.set(
        -flatTangent.z,
        0,
        flatTangent.x
      );


      cameraTarget.addScaledVector(
        sideVector,
        targetLean * 1.6
      );


      cameraTarget.y =
        point.y +
        CAMERA_HEIGHT;



      // ----------------------------------------------------------
      // SMOOTH X/Z ONLY
      // ----------------------------------------------------------

      const horizontalFollow =
        1 -
        Math.exp(
          -delta * 3.0
        );


      camera.position.x =
        THREE.MathUtils.lerp(
          camera.position.x,
          cameraTarget.x,
          horizontalFollow
        );


      camera.position.z =
        THREE.MathUtils.lerp(
          camera.position.z,
          cameraTarget.z,
          horizontalFollow
        );



      // ----------------------------------------------------------
      // Y IS DIRECTLY LINKED
      //
      // This is intentional.
      //
      // No second vertical spring.
      // No vertical lag.
      // No vertical oscillation.
      // ----------------------------------------------------------

      camera.position.y =
        cameraTarget.y;



      // ==========================================================
      // FIXED-PITCH LOOK TARGET
      // ==========================================================

      lookTarget
        .copy(point)
        .addScaledVector(
          flatTangent,
          LOOK_DISTANCE
        );


      lookTarget.y =
        point.y +
        LOOK_HEIGHT;



      // Smooth LEFT / RIGHT direction only.

      const lookFollow =
        1 -
        Math.exp(
          -delta * 3.5
        );


      smoothedLook.x =
        THREE.MathUtils.lerp(
          smoothedLook.x,
          lookTarget.x,
          lookFollow
        );


      smoothedLook.z =
        THREE.MathUtils.lerp(
          smoothedLook.z,
          lookTarget.z,
          lookFollow
        );



      // Y uses exactly the same road altitude reference
      // as the camera.
      //
      // Therefore camera-to-look vertical difference
      // remains constant.

      smoothedLook.y =
        lookTarget.y;


      camera.lookAt(
        smoothedLook
      );



      // ==========================================================
      // RENDER
      // ==========================================================

      renderer.render(
        scene,
        camera
      );

    }



    requestAnimationFrame(
      animate
    );



    // ============================================================
    // RESIZE
    // ============================================================

    function resize() {

      camera.aspect =
        window.innerWidth /
        window.innerHeight;


      camera.updateProjectionMatrix();


      renderer.setSize(
        window.innerWidth,
        window.innerHeight,
        false
      );


      renderer.setPixelRatio(
        Math.min(
          window.devicePixelRatio,
          2
        )
      );

    }


    window.addEventListener(
      "resize",
      resize
    );


  </script>

</body>
</html>
